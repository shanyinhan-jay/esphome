substitutions:
  devicename: smartswitch-3
  # 仅作 Web「HA Illuminance Entity ID」首次默认值；之后请在设备 Web 修改
  ha_illuminance_entity: sensor.outdoor_illuminance

# 本地组件：须与 smartswitch.yaml 同目录存在 components/ha_entity_sensor/（HA 上即 /config/components/...）
external_components:
  - source:
      type: local
      path: components

# 三路固件：3 继电器 / 3 按键 / 3 颗 WS2812；窗帘 2 路=1↔2、3 路=1↔3（见 Curtain Channel Count）
esphome:
  name: $devicename
  on_boot:
    - priority: 600
      then:
        - lambda: 'id(boot_complete) = true;'
        - script.execute: refresh_all_indicators
    - priority: 200
      then:
        - delay: 5s
        - if:
            condition:
              not:
                wifi.connected:
            then:
              - script.execute: wifi_disconnect_blink

esp8266:
  board: esp01_1m

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_key

wifi:
  networks:
    - ssid: !secret Linksys
      password: !secret wifi_password
  ap:
    ssid: $devicename
    password: !secret ap_password
  on_connect:
    - script.stop: wifi_disconnect_blink
    - script.execute: restore_indicator_1
  on_disconnect:
    - script.execute: wifi_disconnect_blink

captive_portal:

web_server:
  port: 80
  # internal 实体默认不在 Web 列出；开启后仅本地页可调，仍不进入 HA/API
  include_internal: true

globals:
  - id: boot_complete
    type: bool
    restore_value: no
    initial_value: 'false'

# WS2812 指示灯策略：
# - 颜色由 number 配置（On/Off RGB 各 0–255），亮度仍为 0–100%；修改后立即刷新
# - 统一用 addressable_set 写像素（script 中不可用 transition_length: 0s，Neopixelbus 已知 bug 会崩溃）
# - boot_complete 防止启动时 restore_mode 触发 on_turn_off 在灯带未就绪时写像素
light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812X
    pin: GPIO4
    num_leds: 3
    name: "WS2812 Strip"
    id: ws2812_strip
    internal: true

  - platform: partition
    name: "Indicator 1"
    id: indicator_1
    internal: true
    segments:
      - id: ws2812_strip
        from: 0
        to: 0

  - platform: partition
    name: "Indicator 2"
    id: indicator_2
    internal: true
    segments:
      - id: ws2812_strip
        from: 1
        to: 1

  - platform: partition
    name: "Indicator 3"
    id: indicator_3
    internal: true
    segments:
      - id: ws2812_strip
        from: 2
        to: 2

switch:
  - platform: gpio
    pin: GPIO12
    name: "Relay 1"
    id: relay_1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            and:
              - switch.is_on: curtain_mode
              - lambda: 'return id(curtain_channel_count).state == "2";'
          then:
            - switch.turn_off: relay_2
      - if:
          condition:
            and:
              - switch.is_on: curtain_mode
              - lambda: 'return id(curtain_channel_count).state == "3";'
          then:
            - switch.turn_off: relay_3
      - script.execute:
          id: set_indicator_on_state
          led_index: 0
    on_turn_off:
      - script.execute:
          id: set_indicator_off_state
          led_index: 0

  - platform: gpio
    pin: GPIO13
    name: "Relay 2"
    id: relay_2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            and:
              - switch.is_on: curtain_mode
              - lambda: 'return id(curtain_channel_count).state == "2";'
          then:
            - switch.turn_off: relay_1
      - script.execute:
          id: set_indicator_on_state
          led_index: 1
    on_turn_off:
      - script.execute:
          id: set_indicator_off_state
          led_index: 1

  - platform: gpio
    pin: GPIO5
    name: "Relay 3"
    id: relay_3
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            and:
              - switch.is_on: curtain_mode
              - lambda: 'return id(curtain_channel_count).state == "3";'
          then:
            - switch.turn_off: relay_1
      - script.execute:
          id: set_indicator_on_state
          led_index: 2
    on_turn_off:
      - script.execute:
          id: set_indicator_off_state
          led_index: 2

  # 窗帘模式：最外侧两路互斥（2 路→1↔2，3 路→1↔3；中间通道 2 在 3 路模式下不参与互斥）
  - platform: template
    name: "Curtain Mode"
    id: curtain_mode
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:curtain
    on_turn_on:
      - if:
          condition:
            and:
              - lambda: 'return id(curtain_channel_count).state == "2";'
              - switch.is_on: relay_1
              - switch.is_on: relay_2
          then:
            - switch.turn_off: relay_2
      - if:
          condition:
            and:
              - lambda: 'return id(curtain_channel_count).state == "3";'
              - switch.is_on: relay_1
              - switch.is_on: relay_3
          then:
            - switch.turn_off: relay_3

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      mode: {input: true, pullup: true}
    name: "Button 1"
    id: button_1
    internal: true
    on_release:
      - switch.toggle: relay_1

  - platform: gpio
    pin:
      number: GPIO0
      mode: {input: true, pullup: true}
    name: "Button 2"
    id: button_2
    internal: true
    on_release:
      - switch.toggle: relay_2

  - platform: gpio
    pin:
      number: GPIO2
      mode: {input: true, pullup: true}
    name: "Button 3"
    id: button_3
    internal: true
    on_release:
      - switch.toggle: relay_3

sensor:
  # 启动时按 Web 中 entity_id 订阅 HA 状态（Native API，等同 homeassistant 平台）
  - platform: ha_entity_sensor
    id: outdoor_illumination
    entity_id_text_id: ha_illuminance_entity_id
    internal: true
    on_value:
      - logger.log:
          format: "HA illuminance: %.2f"
          args: ['x']
      - script.execute: refresh_all_indicators

  - platform: wifi_signal
    name: $devicename signal
    update_interval: 60s

# 窗帘路数：2=最外为通道1与2；3=最外为通道1与3
select:
  - platform: template
    name: "Curtain Channel Count"
    id: curtain_channel_count
    internal: true
    optimistic: true
    restore_value: true
    options:
      - "2"
      - "3"
    initial_option: "3"
    entity_category: config
    icon: mdi:numeric

# 光照：Web 配置 entity_id / 阈值（internal，不进 HA）；改 entity_id 后自动重启以重新订阅
text:
  - platform: template
    name: "HA Illuminance Entity ID"
    id: ha_illuminance_entity_id
    internal: true
    optimistic: true
    restore_value: true
    initial_value: "${ha_illuminance_entity}"
    min_length: 3
    max_length: 64
    mode: text
    entity_category: config
    icon: mdi:home-assistant
    on_value:
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - delay: 1s
            - lambda: |-
                App.safe_reboot();

number:
  - platform: template
    name: "Illuminance Dark Threshold"
    id: illuminance_dark_threshold
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100000
    step: 1
    initial_value: 100
    mode: box
    entity_category: config
    icon: mdi:brightness-5
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Brightness"
    id: indicator_brightness
    internal: true
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 100
    step: 1
    initial_value: 25
    unit_of_measurement: "%"
    mode: slider
    entity_category: config
    icon: mdi:brightness-6
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator On Red"
    id: indicator_on_red
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 0
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator On Green"
    id: indicator_on_green
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 255
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator On Blue"
    id: indicator_on_blue
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 0
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Off Red"
    id: indicator_off_red
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 255
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Off Green"
    id: indicator_off_green
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 0
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Off Blue"
    id: indicator_off_blue
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 0
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

text_sensor:
  - platform: wifi_info
    ip_address:
      name: $devicename IP Address
      icon: mdi:ip-network

script:
  - id: wifi_disconnect_blink
    mode: restart
    then:
      - while:
          condition:
            not:
              wifi.connected:
          then:
            - light.addressable_set:
                id: ws2812_strip
                range_from: 0
                range_to: 0
                red: !lambda 'return id(indicator_off_red).state / 255.0f;'
                green: !lambda 'return id(indicator_off_green).state / 255.0f;'
                blue: !lambda 'return id(indicator_off_blue).state / 255.0f;'
                color_brightness: !lambda 'return id(indicator_brightness).state / 100.0f;'
            - delay: 500ms
            - light.addressable_set:
                id: ws2812_strip
                range_from: 0
                range_to: 0
                red: 0%
                green: 0%
                blue: 0%
            - delay: 500ms

  - id: restore_indicator_1
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: relay_1
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 0
          else:
            - script.execute:
                id: set_indicator_off_state
                led_index: 0

  - id: set_indicator_on_state
    parameters:
      led_index: int
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(boot_complete);'
              - or:
                  - lambda: 'return led_index != 0;'
                  - wifi.connected:
          then:
            - light.addressable_set:
                id: ws2812_strip
                range_from: !lambda 'return led_index;'
                range_to: !lambda 'return led_index;'
                red: !lambda 'return id(indicator_on_red).state / 255.0f;'
                green: !lambda 'return id(indicator_on_green).state / 255.0f;'
                blue: !lambda 'return id(indicator_on_blue).state / 255.0f;'
                color_brightness: !lambda 'return id(indicator_brightness).state / 100.0f;'

  - id: set_indicator_off_state
    parameters:
      led_index: int
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(boot_complete);'
              - or:
                  - lambda: 'return led_index != 0;'
                  - wifi.connected:
          then:
            - if:
                condition:
                  lambda: |-
                    return !isnan(id(outdoor_illumination).state) &&
                           id(outdoor_illumination).state < id(illuminance_dark_threshold).state;
                then:
                  - light.addressable_set:
                      id: ws2812_strip
                      range_from: !lambda 'return led_index;'
                      range_to: !lambda 'return led_index;'
                      red: !lambda 'return id(indicator_off_red).state / 255.0f;'
                      green: !lambda 'return id(indicator_off_green).state / 255.0f;'
                      blue: !lambda 'return id(indicator_off_blue).state / 255.0f;'
                      color_brightness: !lambda 'return id(indicator_brightness).state / 100.0f;'
                else:
                  - light.addressable_set:
                      id: ws2812_strip
                      range_from: !lambda 'return led_index;'
                      range_to: !lambda 'return led_index;'
                      red: 0%
                      green: 0%
                      blue: 0%

  - id: refresh_all_indicators
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: relay_1
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 0
          else:
            - script.execute:
                id: set_indicator_off_state
                led_index: 0
      - if:
          condition:
            switch.is_on: relay_2
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 1
          else:
            - script.execute:
                id: set_indicator_off_state
                led_index: 1
      - if:
          condition:
            switch.is_on: relay_3
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 2
          else:
            - script.execute:
                id: set_indicator_off_state
                led_index: 2
