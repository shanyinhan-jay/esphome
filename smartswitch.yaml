substitutions:
  devicename: smartswitch

esphome:
  name: $devicename
  on_boot:
    priority: 600
    then:
      - lambda: 'id(boot_complete) = true;'
      - script.execute: refresh_off_indicators

esp8266:
  board: nodemcu

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_key

wifi:
  networks:
    - ssid: !secret Linksys
      password: !secret wifi_password
  ap:
    ssid: $devicename
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

# MQTT 仅用于订阅外部光照传感器；discovery 关闭，避免与 ESPHome API 集成重复创建实体
mqtt:
  broker: 192.168.1.250
  port: 1883
  discovery: false

globals:
  - id: boot_complete
    type: bool
    restore_value: no
    initial_value: 'false'

# WS2812 指示灯策略：
# - 继电器打开：partition + light.turn_on + transition_length: 0s（瞬间变绿）
# - 继电器关闭：addressable_set 直接写像素（瞬间变红/熄灭）
#   不可在 script 中使用 transition_length: 0s，也不可设置 default_transition_length: 0s（Neopixelbus 已知 bug，会导致崩溃）
# - boot_complete 防止启动时 restore_mode 触发 on_turn_off 在灯带未就绪时写像素
light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812X
    pin: GPIO4
    num_leds: 3
    name: "WS2812 Strip"
    id: ws2812_strip
    internal: true

  - platform: partition
    name: "Indicator 1"
    id: indicator_1
    internal: true
    segments:
      - id: ws2812_strip
        from: 0
        to: 0

  - platform: partition
    name: "Indicator 2"
    id: indicator_2
    internal: true
    segments:
      - id: ws2812_strip
        from: 1
        to: 1

  - platform: partition
    name: "Indicator 3"
    id: indicator_3
    internal: true
    segments:
      - id: ws2812_strip
        from: 2
        to: 2

switch:
  - platform: gpio
    pin: GPIO12
    name: "Relay 1"
    id: relay_1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: indicator_1
          brightness: 25%
          red: 0%
          green: 100%
          blue: 0%
          transition_length: 0s
    on_turn_off:
      - script.execute:
          id: set_indicator_off_state
          led_index: 0

  - platform: gpio
    pin: GPIO13
    name: "Relay 2"
    id: relay_2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: indicator_2
          brightness: 25%
          red: 0%
          green: 100%
          blue: 0%
          transition_length: 0s
    on_turn_off:
      - script.execute:
          id: set_indicator_off_state
          led_index: 1

  - platform: gpio
    pin: GPIO5
    name: "Relay 3"
    id: relay_3
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: indicator_3
          brightness: 25%
          red: 0%
          green: 100%
          blue: 0%
          transition_length: 0s
    on_turn_off:
      - script.execute:
          id: set_indicator_off_state
          led_index: 2

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      mode: {input: true, pullup: true}
    name: "Button 1"
    id: button_1
    internal: true
    on_press:
      - switch.toggle: relay_1

  - platform: gpio
    pin:
      number: GPIO0
      mode: {input: true, pullup: true}
    name: "Button 2"
    id: button_2
    internal: true
    on_press:
      - switch.toggle: relay_2

  - platform: gpio
    pin:
      number: GPIO2
      mode: {input: true, pullup: true}
    name: "Button 3"
    id: button_3
    internal: true
    on_press:
      - switch.toggle: relay_3

sensor:
  - platform: mqtt_subscribe
    name: "Outdoor Illumination"
    id: outdoor_illumination
    internal: true
    topic: esphome/sensor/outloor_illumination
    on_value:
      - logger.log:
          format: "Received MQTT Illumination Value: %.2f"
          args: ['x']
      - script.execute: refresh_off_indicators

script:
  - id: set_indicator_off_state
    parameters:
      led_index: int
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - if:
                condition:
                  lambda: |-
                    return !isnan(id(outdoor_illumination).state) && id(outdoor_illumination).state < 100.0f;
                then:
                  - light.addressable_set:
                      id: ws2812_strip
                      range_from: !lambda 'return led_index;'
                      range_to: !lambda 'return led_index;'
                      red: 100%
                      green: 0%
                      blue: 0%
                      color_brightness: 25%
                else:
                  - light.addressable_set:
                      id: ws2812_strip
                      range_from: !lambda 'return led_index;'
                      range_to: !lambda 'return led_index;'
                      red: 0%
                      green: 0%
                      blue: 0%

  - id: refresh_off_indicators
    mode: restart
    then:
      - if:
          condition:
            switch.is_off: relay_1
          then:
            - script.execute:
                id: set_indicator_off_state
                led_index: 0
      - if:
          condition:
            switch.is_off: relay_2
          then:
            - script.execute:
                id: set_indicator_off_state
                led_index: 1
      - if:
          condition:
            switch.is_off: relay_3
          then:
            - script.execute:
                id: set_indicator_off_state
                led_index: 2
