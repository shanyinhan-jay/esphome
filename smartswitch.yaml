substitutions:
  devicename: smartswitch

esphome:
  name: $devicename
  on_boot:
    - priority: 600
      then:
        - lambda: 'id(boot_complete) = true;'
        - script.execute: refresh_all_indicators
    - priority: 200
      then:
        - delay: 5s
        - if:
            condition:
              not:
                wifi.connected:
            then:
              - script.execute: wifi_disconnect_blink

esp8266:
  board: esp01_1m

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_key

wifi:
  networks:
    - ssid: !secret Linksys
      password: !secret wifi_password
  ap:
    ssid: $devicename
    password: !secret ap_password
  on_connect:
    - script.stop: wifi_disconnect_blink
    - script.execute: restore_indicator_1
  on_disconnect:
    - script.execute: wifi_disconnect_blink

captive_portal:

web_server:
  port: 80

# MQTT 仅用于订阅外部光照传感器；discovery 关闭，避免与 ESPHome API 集成重复创建实体
mqtt:
  broker: 192.168.1.250
  port: 1883
  discovery: false

globals:
  - id: boot_complete
    type: bool
    restore_value: no
    initial_value: 'false'

# WS2812 指示灯策略：
# - 颜色/亮度由 number 实体配置（Indicator On/Off RGB、Brightness），修改后立即刷新
# - 统一用 addressable_set 写像素（script 中不可用 transition_length: 0s，Neopixelbus 已知 bug 会崩溃）
# - boot_complete 防止启动时 restore_mode 触发 on_turn_off 在灯带未就绪时写像素
light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812X
    pin: GPIO4
    num_leds: 3
    name: "WS2812 Strip"
    id: ws2812_strip
    internal: true

  - platform: partition
    name: "Indicator 1"
    id: indicator_1
    internal: true
    segments:
      - id: ws2812_strip
        from: 0
        to: 0

  - platform: partition
    name: "Indicator 2"
    id: indicator_2
    internal: true
    segments:
      - id: ws2812_strip
        from: 1
        to: 1

  - platform: partition
    name: "Indicator 3"
    id: indicator_3
    internal: true
    segments:
      - id: ws2812_strip
        from: 2
        to: 2

switch:
  - platform: gpio
    pin: GPIO12
    name: "Relay 1"
    id: relay_1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute:
          id: set_indicator_on_state
          led_index: 0
    on_turn_off:
      - script.execute:
          id: set_indicator_off_state
          led_index: 0

  - platform: gpio
    pin: GPIO13
    name: "Relay 2"
    id: relay_2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute:
          id: set_indicator_on_state
          led_index: 1
    on_turn_off:
      - script.execute:
          id: set_indicator_off_state
          led_index: 1

  - platform: gpio
    pin: GPIO5
    name: "Relay 3"
    id: relay_3
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute:
          id: set_indicator_on_state
          led_index: 2
    on_turn_off:
      - script.execute:
          id: set_indicator_off_state
          led_index: 2

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      mode: {input: true, pullup: true}
    name: "Button 1"
    id: button_1
    internal: true
    on_release:
      - switch.toggle: relay_1

  - platform: gpio
    pin:
      number: GPIO0
      mode: {input: true, pullup: true}
    name: "Button 2"
    id: button_2
    internal: true
    on_release:
      - switch.toggle: relay_2

  - platform: gpio
    pin:
      number: GPIO2
      mode: {input: true, pullup: true}
    name: "Button 3"
    id: button_3
    internal: true
    on_release:
      - switch.toggle: relay_3

sensor:
  - platform: mqtt_subscribe
    name: "Outdoor Illumination"
    id: outdoor_illumination
    internal: true
    topic: esphome/sensor/outloor_illumination
    on_value:
      - logger.log:
          format: "Received MQTT Illumination Value: %.2f"
          args: ['x']
      - script.execute: refresh_all_indicators

  - platform: wifi_signal
    name: $devicename signal
    update_interval: 60s

# 指示灯颜色/亮度可在 Home Assistant 或 Web 界面调节，重启后保留
number:
  - platform: template
    name: "Indicator Brightness"
    id: indicator_brightness
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 100
    step: 1
    initial_value: 25
    unit_of_measurement: "%"
    mode: slider
    entity_category: config
    icon: mdi:brightness-6
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator On Red"
    id: indicator_on_red
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    unit_of_measurement: "%"
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator On Green"
    id: indicator_on_green
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    unit_of_measurement: "%"
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator On Blue"
    id: indicator_on_blue
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    unit_of_measurement: "%"
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Off Red"
    id: indicator_off_red
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    unit_of_measurement: "%"
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Off Green"
    id: indicator_off_green
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    unit_of_measurement: "%"
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Off Blue"
    id: indicator_off_blue
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    unit_of_measurement: "%"
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

text_sensor:
  - platform: wifi_info
    ip_address:
      name: $devicename IP Address
      icon: mdi:ip-network

    
script:
  - id: wifi_disconnect_blink
    mode: restart
    then:
      - while:
          condition:
            not:
              wifi.connected:
          then:
            - light.addressable_set:
                id: ws2812_strip
                range_from: 0
                range_to: 0
                red: !lambda 'return id(indicator_off_red).state / 100.0f;'
                green: !lambda 'return id(indicator_off_green).state / 100.0f;'
                blue: !lambda 'return id(indicator_off_blue).state / 100.0f;'
                color_brightness: !lambda 'return id(indicator_brightness).state / 100.0f;'
            - delay: 500ms
            - light.addressable_set:
                id: ws2812_strip
                range_from: 0
                range_to: 0
                red: 0%
                green: 0%
                blue: 0%
            - delay: 500ms

  - id: restore_indicator_1
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: relay_1
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 0
          else:
            - script.execute:
                id: set_indicator_off_state
                led_index: 0

  - id: set_indicator_on_state
    parameters:
      led_index: int
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(boot_complete);'
              - or:
                  - lambda: 'return led_index != 0;'
                  - wifi.connected:
          then:
            - light.addressable_set:
                id: ws2812_strip
                range_from: !lambda 'return led_index;'
                range_to: !lambda 'return led_index;'
                red: !lambda 'return id(indicator_on_red).state / 100.0f;'
                green: !lambda 'return id(indicator_on_green).state / 100.0f;'
                blue: !lambda 'return id(indicator_on_blue).state / 100.0f;'
                color_brightness: !lambda 'return id(indicator_brightness).state / 100.0f;'

  - id: set_indicator_off_state
    parameters:
      led_index: int
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(boot_complete);'
              - or:
                  - lambda: 'return led_index != 0;'
                  - wifi.connected:
          then:
            - if:
                condition:
                  lambda: |-
                    return !isnan(id(outdoor_illumination).state) && id(outdoor_illumination).state < 100.0f;
                then:
                  - light.addressable_set:
                      id: ws2812_strip
                      range_from: !lambda 'return led_index;'
                      range_to: !lambda 'return led_index;'
                      red: !lambda 'return id(indicator_off_red).state / 100.0f;'
                      green: !lambda 'return id(indicator_off_green).state / 100.0f;'
                      blue: !lambda 'return id(indicator_off_blue).state / 100.0f;'
                      color_brightness: !lambda 'return id(indicator_brightness).state / 100.0f;'
                else:
                  - light.addressable_set:
                      id: ws2812_strip
                      range_from: !lambda 'return led_index;'
                      range_to: !lambda 'return led_index;'
                      red: 0%
                      green: 0%
                      blue: 0%

  - id: refresh_all_indicators
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: relay_1
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 0
          else:
            - script.execute:
                id: set_indicator_off_state
                led_index: 0
      - if:
          condition:
            switch.is_on: relay_2
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 1
          else:
            - script.execute:
                id: set_indicator_off_state
                led_index: 1
      - if:
          condition:
            switch.is_on: relay_3
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 2
          else:
            - script.execute:
                id: set_indicator_off_state
                led_index: 2
