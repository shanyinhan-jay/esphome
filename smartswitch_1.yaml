substitutions:
  devicename: smartswitch-1
  ha_illuminance_entity: sensor.outdoor_illuminance

external_components:
  - source:
      type: local
      path: components

# 单路固件：1 继电器 / 1 按键 / 1 颗 WS2812（无窗帘模式）
preferences:
  flash_write_interval: 0s

esphome:
  name: $devicename
  on_boot:
    - priority: 900
      then:
        - lambda: |-
            ESP_LOGI("smartswitch", "BOOT restored prefs: on=%s off=%s bri=%.0f lux_thr=%.0f ha_ent=%s d1=%d",
                     id(indicator_on_color_hex).state.c_str(), id(indicator_off_color_hex).state.c_str(),
                     id(indicator_brightness).state, id(illuminance_dark_threshold).state,
                     id(ha_illuminance_entity_id).state.c_str(),
                     (int) id(channel_1_button_decouple).state);
    - priority: -100
      then:
        - delay: 800ms
        - lambda: |-
            id(config_save_enabled) = true;
            ESP_LOGI("smartswitch", "config_save_enabled=true (after UI restore settled)");
        - delay: 100ms
        - lambda: 'id(boot_complete) = true;'
        - lambda: 'ESP_LOGI("smartswitch", "boot_complete=true, refresh_all_indicators");'
        - script.execute: refresh_all_indicators
    - priority: 200
      then:
        - delay: 5s
        - if:
            condition:
              not:
                wifi.connected:
            then:
              - script.execute: wifi_disconnect_blink
  on_shutdown:
    - lambda: 'global_preferences->sync();'

esp8266:
  board: esp01_1m
  restore_from_flash: true

logger:
  level: INFO

api:

ota:
  - platform: esphome
    password: !secret ota_key

wifi:
  networks:
    - ssid: !secret Linksys
      password: !secret wifi_password
  ap:
    ssid: $devicename
    password: !secret ap_password
  on_connect:
    - script.stop: wifi_disconnect_blink
    - script.execute: restore_indicator_1
  on_disconnect:
    - script.execute: wifi_disconnect_blink

captive_portal:

web_server:
  port: 80
  version: 2
  include_internal: false

globals:
  - id: boot_complete
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: config_save_enabled
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: decoupled_led_1
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: color_work_r
    type: int
    restore_value: no
    initial_value: '0'
  - id: color_work_g
    type: int
    restore_value: no
    initial_value: '255'
  - id: color_work_b
    type: int
    restore_value: no
    initial_value: '0'

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812X
    pin: GPIO4
    num_leds: 1
    name: "WS2812 Strip"
    id: ws2812_strip
    internal: true

  - platform: partition
    name: "Channel 1 LED"
    id: indicator_1
    segments:
      - id: ws2812_strip
        from: 0
        to: 0
    on_turn_on:
      - if:
          condition:
            switch.is_on: channel_1_button_decouple
          then:
            - lambda: 'id(decoupled_led_1) = true;'
            - script.execute:
                id: set_indicator_on_state
                led_index: 0
    on_turn_off:
      - if:
          condition:
            switch.is_on: channel_1_button_decouple
          then:
            - lambda: 'id(decoupled_led_1) = false;'
            - script.execute:
                id: set_indicator_off_state
                led_index: 0

switch:
  - platform: gpio
    pin: GPIO12
    name: "Relay 1"
    id: relay_1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            not:
              switch.is_on: channel_1_button_decouple
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 0
    on_turn_off:
      - if:
          condition:
            not:
              switch.is_on: channel_1_button_decouple
          then:
            - script.execute:
                id: set_indicator_off_state
                led_index: 0

  - platform: template
    name: "Channel 1 Button Decouple"
    id: channel_1_button_decouple
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:gesture-tap-button
    on_turn_on:
      - script.execute: refresh_all_indicators
    on_turn_off:
      - script.execute: refresh_all_indicators

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      mode: {input: true, pullup: true}
    name: "Button 1"
    id: button_1
    on_release:
      - if:
          condition:
            not:
              switch.is_on: channel_1_button_decouple
          then:
            - switch.toggle: relay_1

sensor:
  - platform: ha_entity_sensor
    id: outdoor_illumination
    entity_id_text_id: ha_illuminance_entity_id
    internal: true
    on_value:
      - logger.log:
          format: "HA illuminance: %.2f"
          args: ['x']
      - script.execute: refresh_all_indicators

  - platform: wifi_signal
    name: $devicename signal
    update_interval: 300s
    internal: true

text:
  - platform: template
    name: "HA Illuminance Entity ID"
    id: ha_illuminance_entity_id
    optimistic: true
    restore_value: true
    initial_value: "${ha_illuminance_entity}"
    min_length: 3
    max_length: 64
    mode: text
    entity_category: config
    icon: mdi:home-assistant
    on_value:
      - lambda: |-
          if (!id(config_save_enabled)) {
            ESP_LOGI("smartswitch", "SAVE ha_entity ignored (init) ui=%s",
                     id(ha_illuminance_entity_id).state.c_str());
            return;
          }
          ESP_LOGI("smartswitch", "SAVE ha_entity=%s", id(ha_illuminance_entity_id).state.c_str());
      - lambda: 'global_preferences->sync();'
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - delay: 1s
            - lambda: |-
                App.safe_reboot();

  - platform: template
    name: "Relay On LED Color"
    id: indicator_on_color_hex
    optimistic: true
    restore_value: true
    initial_value: "#cc00c8"
    min_length: 6
    max_length: 7
    mode: text
    entity_category: config
    icon: mdi:palette
    on_value:
      - lambda: |-
          if (!id(config_save_enabled)) {
            ESP_LOGI("smartswitch", "SAVE on_color ignored (init) ui=%s",
                     id(indicator_on_color_hex).state.c_str());
            return;
          }
          ESP_LOGI("smartswitch", "SAVE on_color=%s", id(indicator_on_color_hex).state.c_str());
      - lambda: 'global_preferences->sync();'
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - delay: 400ms
            - script.execute: refresh_all_indicators

  - platform: template
    name: "Relay Off LED Color"
    id: indicator_off_color_hex
    optimistic: true
    restore_value: true
    initial_value: "#05cc00"
    min_length: 6
    max_length: 7
    mode: text
    entity_category: config
    icon: mdi:palette-outline
    on_value:
      - lambda: |-
          if (!id(config_save_enabled)) {
            ESP_LOGI("smartswitch", "SAVE off_color ignored (init) ui=%s",
                     id(indicator_off_color_hex).state.c_str());
            return;
          }
          ESP_LOGI("smartswitch", "SAVE off_color=%s", id(indicator_off_color_hex).state.c_str());
      - lambda: 'global_preferences->sync();'
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - delay: 400ms
            - script.execute: refresh_all_indicators

number:
  - platform: template
    name: "Illuminance Dark Threshold"
    id: illuminance_dark_threshold
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100000
    step: 1
    initial_value: 100
    mode: box
    entity_category: config
    icon: mdi:brightness-5
    on_value:
      - lambda: |-
          if (!id(config_save_enabled)) return;
          ESP_LOGI("smartswitch", "SAVE lux_thr=%.0f", id(illuminance_dark_threshold).state);
      - lambda: 'global_preferences->sync();'
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Brightness"
    id: indicator_brightness
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 40
    mode: slider
    entity_category: config
    icon: mdi:brightness-6
    on_value:
      - lambda: |-
          if (!id(config_save_enabled)) return;
          ESP_LOGI("smartswitch", "SAVE brightness=%.0f", id(indicator_brightness).state);
      - lambda: 'global_preferences->sync();'
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - script.execute: refresh_all_indicators

text_sensor:
  - platform: wifi_info
    ip_address:
      name: $devicename IP Address
      icon: mdi:ip-network
      internal: true

script:
  - id: parse_on_color_hex
    mode: restart
    then:
      - lambda: |-
          std::string s = id(indicator_on_color_hex).state;
          if (!s.empty() && s[0] == '#') {
            s.erase(0, 1);
          }
          int r = 204, g = 0, b = 200;
          if (s.length() == 6) {
            char *end = nullptr;
            unsigned long v = strtoul(s.c_str(), &end, 16);
            if (end == s.c_str() + 6) {
              r = (v >> 16) & 0xFF;
              g = (v >> 8) & 0xFF;
              b = v & 0xFF;
            }
          }
          id(color_work_r) = r;
          id(color_work_g) = g;
          id(color_work_b) = b;

  - id: parse_off_color_hex
    mode: restart
    then:
      - lambda: |-
          std::string s = id(indicator_off_color_hex).state;
          if (!s.empty() && s[0] == '#') {
            s.erase(0, 1);
          }
          int r = 5, g = 204, b = 0;
          if (s.length() == 6) {
            char *end = nullptr;
            unsigned long v = strtoul(s.c_str(), &end, 16);
            if (end == s.c_str() + 6) {
              r = (v >> 16) & 0xFF;
              g = (v >> 8) & 0xFF;
              b = v & 0xFF;
            }
          }
          id(color_work_r) = r;
          id(color_work_g) = g;
          id(color_work_b) = b;

  - id: wifi_disconnect_blink
    mode: restart
    then:
      - while:
          condition:
            not:
              wifi.connected:
          then:
            - script.execute: parse_off_color_hex
            - light.addressable_set:
                id: ws2812_strip
                range_from: 0
                range_to: 0
                red: !lambda 'return id(color_work_r) / 255.0f;'
                green: !lambda 'return id(color_work_g) / 255.0f;'
                blue: !lambda 'return id(color_work_b) / 255.0f;'
                color_brightness: !lambda 'return id(indicator_brightness).state / 255.0f;'
            - delay: 500ms
            - light.addressable_set:
                id: ws2812_strip
                range_from: 0
                range_to: 0
                red: 0%
                green: 0%
                blue: 0%
            - delay: 500ms

  - id: apply_decoupled_led
    parameters:
      led_index: int
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return led_index == 0 && id(decoupled_led_1);'
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 0
          else:
            - script.execute:
                id: set_indicator_off_state
                led_index: !lambda 'return led_index;'

  - id: restore_indicator_1
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: channel_1_button_decouple
          then:
            - script.execute:
                id: apply_decoupled_led
                led_index: 0
          else:
            - if:
                condition:
                  switch.is_on: relay_1
                then:
                  - script.execute:
                      id: set_indicator_on_state
                      led_index: 0
                else:
                  - script.execute:
                      id: set_indicator_off_state
                      led_index: 0

  - id: set_indicator_on_state
    parameters:
      led_index: int
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - lambda: |-
                std::string s = id(indicator_on_color_hex).state;
                while (!s.empty() && (s.front() == ' ' || s.front() == '\t')) {
                  s.erase(0, 1);
                }
                while (!s.empty() && (s.back() == ' ' || s.back() == '\t')) {
                  s.pop_back();
                }
                if (!s.empty() && s[0] == '#') {
                  s.erase(0, 1);
                }
                int r = 204, g = 0, b = 200;
                if (s.length() == 6) {
                  char *end = nullptr;
                  unsigned long v = strtoul(s.c_str(), &end, 16);
                  if (end == s.c_str() + 6) {
                    r = (v >> 16) & 0xFF;
                    g = (v >> 8) & 0xFF;
                    b = v & 0xFF;
                  }
                }
                id(color_work_r) = r;
                id(color_work_g) = g;
                id(color_work_b) = b;
            - light.addressable_set:
                id: ws2812_strip
                range_from: !lambda 'return led_index;'
                range_to: !lambda 'return led_index;'
                red: !lambda 'return id(color_work_r) / 255.0f;'
                green: !lambda 'return id(color_work_g) / 255.0f;'
                blue: !lambda 'return id(color_work_b) / 255.0f;'
                color_brightness: !lambda 'return id(indicator_brightness).state / 255.0f;'

  - id: set_indicator_off_state
    parameters:
      led_index: int
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - if:
                condition:
                  lambda: |-
                    return !isnan(id(outdoor_illumination).state) &&
                           id(outdoor_illumination).state < id(illuminance_dark_threshold).state;
                then:
                  - lambda: |-
                      std::string s = id(indicator_off_color_hex).state;
                      while (!s.empty() && (s.front() == ' ' || s.front() == '\t')) {
                        s.erase(0, 1);
                      }
                      while (!s.empty() && (s.back() == ' ' || s.back() == '\t')) {
                        s.pop_back();
                      }
                      if (!s.empty() && s[0] == '#') {
                        s.erase(0, 1);
                      }
                      int r = 5, g = 204, b = 0;
                      if (s.length() == 6) {
                        char *end = nullptr;
                        unsigned long v = strtoul(s.c_str(), &end, 16);
                        if (end == s.c_str() + 6) {
                          r = (v >> 16) & 0xFF;
                          g = (v >> 8) & 0xFF;
                          b = v & 0xFF;
                        }
                      }
                      id(color_work_r) = r;
                      id(color_work_g) = g;
                      id(color_work_b) = b;
                  - light.addressable_set:
                      id: ws2812_strip
                      range_from: !lambda 'return led_index;'
                      range_to: !lambda 'return led_index;'
                      red: !lambda 'return id(color_work_r) / 255.0f;'
                      green: !lambda 'return id(color_work_g) / 255.0f;'
                      blue: !lambda 'return id(color_work_b) / 255.0f;'
                      color_brightness: !lambda 'return id(indicator_brightness).state / 255.0f;'
                else:
                  - light.addressable_set:
                      id: ws2812_strip
                      range_from: !lambda 'return led_index;'
                      range_to: !lambda 'return led_index;'
                      red: 0%
                      green: 0%
                      blue: 0%

  - id: refresh_all_indicators
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - if:
                condition:
                  switch.is_on: channel_1_button_decouple
                then:
                  - script.execute:
                      id: apply_decoupled_led
                      led_index: 0
                else:
                  - if:
                      condition:
                        switch.is_on: relay_1
                      then:
                        - script.execute:
                            id: set_indicator_on_state
                            led_index: 0
                      else:
                        - script.execute:
                            id: set_indicator_off_state
                            led_index: 0
