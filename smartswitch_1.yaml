substitutions:
  devicename: smartswitch-1
  ha_illuminance_entity: sensor.outdoor_illuminance

external_components:
  - source:
      type: local
      path: components

# 单路固件：1 继电器 / 1 按键 / 1 颗 WS2812（无窗帘模式）
esphome:
  name: $devicename
  on_boot:
    - priority: -100
      then:
        - delay: 100ms
        - script.execute: sync_indicator_colors_from_hex
        - lambda: 'id(boot_complete) = true;'
        - script.execute: refresh_all_indicators
    - priority: 200
      then:
        - delay: 5s
        - if:
            condition:
              not:
                wifi.connected:
            then:
              - script.execute: wifi_disconnect_blink

esp8266:
  board: esp01_1m

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_key

wifi:
  networks:
    - ssid: !secret Linksys
      password: !secret wifi_password
  ap:
    ssid: $devicename
    password: !secret ap_password
  on_connect:
    - script.stop: wifi_disconnect_blink
    - script.execute: restore_indicator_1
  on_disconnect:
    - script.execute: wifi_disconnect_blink

captive_portal:

web_server:
  port: 80
  include_internal: false

globals:
  - id: boot_complete
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: on_color_r
    type: int
    restore_value: no
    initial_value: '193'
  - id: on_color_g
    type: int
    restore_value: no
    initial_value: '6'
  - id: on_color_b
    type: int
    restore_value: no
    initial_value: '190'
  - id: off_color_r
    type: int
    restore_value: no
    initial_value: '22'
  - id: off_color_g
    type: int
    restore_value: no
    initial_value: '193'
  - id: off_color_b
    type: int
    restore_value: no
    initial_value: '6'

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812X
    pin: GPIO4
    num_leds: 1
    id: ws2812_strip
    internal: true

switch:
  - platform: gpio
    pin: GPIO12
    name: "Relay 1"
    id: relay_1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute:
          id: set_indicator_on_state
          led_index: 0
    on_turn_off:
      - script.execute:
          id: set_indicator_off_state
          led_index: 0

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      mode: {input: true, pullup: true}
    id: button_1
    internal: true
    on_release:
      - switch.toggle: relay_1

sensor:
  - platform: ha_entity_sensor
    id: outdoor_illumination
    entity_id_text_id: ha_illuminance_entity_id
    internal: true
    on_value:
      - logger.log:
          format: "HA illuminance: %.2f"
          args: ['x']
      - script.execute: refresh_all_indicators

  - platform: wifi_signal
    name: $devicename signal
    update_interval: 60s

text:
  - platform: template
    name: "HA Illuminance Entity ID"
    id: ha_illuminance_entity_id
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: "${ha_illuminance_entity}"
    min_length: 3
    max_length: 64
    mode: text
    entity_category: config
    icon: mdi:home-assistant
    on_value:
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - delay: 1s
            - lambda: |-
                App.safe_reboot();

  - platform: template
    name: "Indicator On Color"
    id: indicator_on_color
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: "#c106be"
    min_length: 7
    max_length: 7
    mode: text
    entity_category: config
    icon: mdi:palette
    on_value:
      - script.execute: sync_indicator_colors_from_hex
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Off Color"
    id: indicator_off_color
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: "#16c106"
    min_length: 7
    max_length: 7
    mode: text
    entity_category: config
    icon: mdi:palette-outline
    on_value:
      - script.execute: sync_indicator_colors_from_hex
      - script.execute: refresh_all_indicators

number:
  - platform: template
    name: "Illuminance Dark Threshold"
    id: illuminance_dark_threshold
    disabled_by_default: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100000
    step: 1
    initial_value: 100
    mode: box
    entity_category: config
    icon: mdi:brightness-5
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Brightness"
    id: indicator_brightness
    disabled_by_default: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 64
    mode: slider
    entity_category: config
    icon: mdi:brightness-6
    on_value:
      - script.execute: refresh_all_indicators

text_sensor:
  - platform: wifi_info
    ip_address:
      name: $devicename IP Address
      icon: mdi:ip-network

script:
  - id: sync_indicator_colors_from_hex
    mode: restart
    then:
      - lambda: |-
          auto parse = [](const std::string &in, int &r, int &g, int &b) {
            std::string s = in;
            if (!s.empty() && s[0] == '#')
              s = s.substr(1);
            r = g = b = 0;
            unsigned int ur = 0, ug = 0, ub = 0;
            if (s.size() >= 6 && sscanf(s.c_str(), "%2x%2x%2x", &ur, &ug, &ub) == 3) {
              r = (int) ur;
              g = (int) ug;
              b = (int) ub;
            }
          };
          parse(id(indicator_on_color).state, id(on_color_r), id(on_color_g), id(on_color_b));
          parse(id(indicator_off_color).state, id(off_color_r), id(off_color_g), id(off_color_b));

  - id: wifi_disconnect_blink
    mode: restart
    then:
      - while:
          condition:
            not:
              wifi.connected:
          then:
            - light.addressable_set:
                id: ws2812_strip
                range_from: 0
                range_to: 0
                red: !lambda 'return id(off_color_r) / 255.0f;'
                green: !lambda 'return id(off_color_g) / 255.0f;'
                blue: !lambda 'return id(off_color_b) / 255.0f;'
                color_brightness: !lambda 'return id(indicator_brightness).state / 255.0f;'
            - delay: 500ms
            - light.addressable_set:
                id: ws2812_strip
                range_from: 0
                range_to: 0
                red: 0%
                green: 0%
                blue: 0%
            - delay: 500ms

  - id: restore_indicator_1
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: relay_1
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 0
          else:
            - script.execute:
                id: set_indicator_off_state
                led_index: 0

  - id: set_indicator_on_state
    parameters:
      led_index: int
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(boot_complete);'
              - or:
                  - lambda: 'return led_index != 0;'
                  - wifi.connected:
          then:
            - light.addressable_set:
                id: ws2812_strip
                range_from: !lambda 'return led_index;'
                range_to: !lambda 'return led_index;'
                red: !lambda 'return id(on_color_r) / 255.0f;'
                green: !lambda 'return id(on_color_g) / 255.0f;'
                blue: !lambda 'return id(on_color_b) / 255.0f;'
                color_brightness: !lambda 'return id(indicator_brightness).state / 255.0f;'

  - id: set_indicator_off_state
    parameters:
      led_index: int
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(boot_complete);'
              - or:
                  - lambda: 'return led_index != 0;'
                  - wifi.connected:
          then:
            - if:
                condition:
                  lambda: |-
                    return !isnan(id(outdoor_illumination).state) &&
                           id(outdoor_illumination).state < id(illuminance_dark_threshold).state;
                then:
                  - light.addressable_set:
                      id: ws2812_strip
                      range_from: !lambda 'return led_index;'
                      range_to: !lambda 'return led_index;'
                      red: !lambda 'return id(off_color_r) / 255.0f;'
                      green: !lambda 'return id(off_color_g) / 255.0f;'
                      blue: !lambda 'return id(off_color_b) / 255.0f;'
                      color_brightness: !lambda 'return id(indicator_brightness).state / 255.0f;'
                else:
                  - light.addressable_set:
                      id: ws2812_strip
                      range_from: !lambda 'return led_index;'
                      range_to: !lambda 'return led_index;'
                      red: 0%
                      green: 0%
                      blue: 0%

  - id: refresh_all_indicators
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - if:
                condition:
                  switch.is_on: relay_1
                then:
                  - script.execute:
                      id: set_indicator_on_state
                      led_index: 0
                else:
                  - script.execute:
                      id: set_indicator_off_state
                      led_index: 0
