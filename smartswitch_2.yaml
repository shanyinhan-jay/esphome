substitutions:
  devicename: smartswitch-2
  ha_illuminance_entity: sensor.outdoor_illuminance

external_components:
  - source:
      type: local
      path: components

# 双路固件：沿用三路板上的通道 1 与 3（GPIO12/14/LED0 + GPIO5/2/LED2）；灯带仍为 3 颗，中间不占用
esphome:
  name: $devicename
  on_boot:
    - priority: 600
      then:
        - lambda: 'id(boot_complete) = true;'
        - script.execute: refresh_all_indicators
    - priority: 200
      then:
        - delay: 5s
        - if:
            condition:
              not:
                wifi.connected:
            then:
              - script.execute: wifi_disconnect_blink

esp8266:
  board: esp01_1m

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_key

wifi:
  networks:
    - ssid: !secret Linksys
      password: !secret wifi_password
  ap:
    ssid: $devicename
    password: !secret ap_password
  on_connect:
    - script.stop: wifi_disconnect_blink
    - script.execute: restore_indicator_1
  on_disconnect:
    - script.execute: wifi_disconnect_blink

captive_portal:

web_server:
  port: 80
  include_internal: true

globals:
  - id: boot_complete
    type: bool
    restore_value: no
    initial_value: 'false'

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812X
    pin: GPIO4
    num_leds: 3
    name: "WS2812 Strip"
    id: ws2812_strip
    internal: true

  - platform: partition
    name: "Indicator 1"
    id: indicator_1
    internal: true
    segments:
      - id: ws2812_strip
        from: 0
        to: 0

  - platform: partition
    name: "Indicator 2"
    id: indicator_2
    internal: true
    segments:
      - id: ws2812_strip
        from: 2
        to: 2

switch:
  - platform: gpio
    pin: GPIO12
    name: "Relay 1"
    id: relay_1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            switch.is_on: curtain_mode
          then:
            - switch.turn_off: relay_2
      - script.execute:
          id: set_indicator_on_state
          led_index: 0
    on_turn_off:
      - script.execute:
          id: set_indicator_off_state
          led_index: 0

  - platform: gpio
    pin: GPIO5
    name: "Relay 2"
    id: relay_2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            switch.is_on: curtain_mode
          then:
            - switch.turn_off: relay_1
      - script.execute:
          id: set_indicator_on_state
          led_index: 2
    on_turn_off:
      - script.execute:
          id: set_indicator_off_state
          led_index: 2

  - platform: template
    name: "Curtain Mode"
    id: curtain_mode
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:curtain
    on_turn_on:
      - if:
          condition:
            and:
              - switch.is_on: relay_1
              - switch.is_on: relay_2
          then:
            - switch.turn_off: relay_2

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      mode: {input: true, pullup: true}
    name: "Button 1"
    id: button_1
    internal: true
    on_release:
      - switch.toggle: relay_1

  - platform: gpio
    pin:
      number: GPIO2
      mode: {input: true, pullup: true}
    name: "Button 2"
    id: button_2
    internal: true
    on_release:
      - switch.toggle: relay_2

sensor:
  - platform: ha_entity_sensor
    id: outdoor_illumination
    entity_id_text_id: ha_illuminance_entity_id
    internal: true
    on_value:
      - logger.log:
          format: "HA illuminance: %.2f"
          args: ['x']
      - script.execute: refresh_all_indicators

  - platform: wifi_signal
    name: $devicename signal
    update_interval: 60s

text:
  - platform: template
    name: "HA Illuminance Entity ID"
    id: ha_illuminance_entity_id
    internal: true
    optimistic: true
    restore_value: true
    initial_value: "${ha_illuminance_entity}"
    min_length: 3
    max_length: 64
    mode: text
    entity_category: config
    icon: mdi:home-assistant
    on_value:
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - delay: 1s
            - lambda: |-
                App.safe_reboot();

number:
  - platform: template
    name: "Illuminance Dark Threshold"
    id: illuminance_dark_threshold
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100000
    step: 1
    initial_value: 100
    mode: box
    entity_category: config
    icon: mdi:brightness-5
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Brightness"
    id: indicator_brightness
    internal: true
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 100
    step: 1
    initial_value: 25
    unit_of_measurement: "%"
    mode: slider
    entity_category: config
    icon: mdi:brightness-6
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator On Red"
    id: indicator_on_red
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 0
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator On Green"
    id: indicator_on_green
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 255
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator On Blue"
    id: indicator_on_blue
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 0
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Off Red"
    id: indicator_off_red
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 255
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Off Green"
    id: indicator_off_green
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 0
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

  - platform: template
    name: "Indicator Off Blue"
    id: indicator_off_blue
    internal: true
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 0
    mode: slider
    entity_category: config
    on_value:
      - script.execute: refresh_all_indicators

text_sensor:
  - platform: wifi_info
    ip_address:
      name: $devicename IP Address
      icon: mdi:ip-network

script:
  - id: wifi_disconnect_blink
    mode: restart
    then:
      - while:
          condition:
            not:
              wifi.connected:
          then:
            - light.addressable_set:
                id: ws2812_strip
                range_from: 0
                range_to: 0
                red: !lambda 'return id(indicator_off_red).state / 255.0f;'
                green: !lambda 'return id(indicator_off_green).state / 255.0f;'
                blue: !lambda 'return id(indicator_off_blue).state / 255.0f;'
                color_brightness: !lambda 'return id(indicator_brightness).state / 100.0f;'
            - delay: 500ms
            - light.addressable_set:
                id: ws2812_strip
                range_from: 0
                range_to: 0
                red: 0%
                green: 0%
                blue: 0%
            - delay: 500ms

  - id: restore_indicator_1
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: relay_1
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 0
          else:
            - script.execute:
                id: set_indicator_off_state
                led_index: 0

  - id: set_indicator_on_state
    parameters:
      led_index: int
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(boot_complete);'
              - or:
                  - lambda: 'return led_index != 0;'
                  - wifi.connected:
          then:
            - light.addressable_set:
                id: ws2812_strip
                range_from: !lambda 'return led_index;'
                range_to: !lambda 'return led_index;'
                red: !lambda 'return id(indicator_on_red).state / 255.0f;'
                green: !lambda 'return id(indicator_on_green).state / 255.0f;'
                blue: !lambda 'return id(indicator_on_blue).state / 255.0f;'
                color_brightness: !lambda 'return id(indicator_brightness).state / 100.0f;'

  - id: set_indicator_off_state
    parameters:
      led_index: int
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(boot_complete);'
              - or:
                  - lambda: 'return led_index != 0;'
                  - wifi.connected:
          then:
            - if:
                condition:
                  lambda: |-
                    return !isnan(id(outdoor_illumination).state) &&
                           id(outdoor_illumination).state < id(illuminance_dark_threshold).state;
                then:
                  - light.addressable_set:
                      id: ws2812_strip
                      range_from: !lambda 'return led_index;'
                      range_to: !lambda 'return led_index;'
                      red: !lambda 'return id(indicator_off_red).state / 255.0f;'
                      green: !lambda 'return id(indicator_off_green).state / 255.0f;'
                      blue: !lambda 'return id(indicator_off_blue).state / 255.0f;'
                      color_brightness: !lambda 'return id(indicator_brightness).state / 100.0f;'
                else:
                  - light.addressable_set:
                      id: ws2812_strip
                      range_from: !lambda 'return led_index;'
                      range_to: !lambda 'return led_index;'
                      red: 0%
                      green: 0%
                      blue: 0%

  - id: refresh_all_indicators
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: relay_1
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 0
          else:
            - script.execute:
                id: set_indicator_off_state
                led_index: 0
      - if:
          condition:
            switch.is_on: relay_2
          then:
            - script.execute:
                id: set_indicator_on_state
                led_index: 2
          else:
            - script.execute:
                id: set_indicator_off_state
                led_index: 2
      - light.addressable_set:
          id: ws2812_strip
          range_from: 1
          range_to: 1
          red: 0%
          green: 0%
          blue: 0%
